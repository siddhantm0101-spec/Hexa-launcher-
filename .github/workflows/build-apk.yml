name: Build HEXA Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Find HEXA Project and Build APK
        run: |
          PROJECT_DIR=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f "build.gradle.kts" ] || [ ! -d "app" ]; then
            echo "ERROR: Root build.gradle.kts or app folder missing!"
            exit 1
          fi

          gradle --no-daemon assembleDebug

      - name: Upload HEXA APK
        uses: actions/upload-artifact@v4
        with:
          name: HEXA-Launcher-1.1-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
